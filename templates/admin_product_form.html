{% extends "base.html" %}
{% block title %}{{ 'პროდუქტის რედაქტირება' if product else 'ახალი პროდუქტი' }} — სახლური გემო{% endblock %}
{% block content %}

<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="bg-white border rounded-4 p-4 p-lg-5">
            <h4 class="fw-bold mb-4">{{ 'პროდუქტის რედაქტირება' if product else 'ახალი პროდუქტის დამატება' }}</h4>
            <form method="POST" enctype="multipart/form-data">
                <div class="row g-3">
                    <div class="col-md-8">
                        <label class="form-label small fw-semibold">დასახელება *</label>
                        <input type="text" name="title" class="form-control rounded-3" value="{{ product.title if product else '' }}" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label small fw-semibold">კატეგორია *</label>
                        <select name="category" class="form-select rounded-3">
                            {% for cat in categories %}
                            <option value="{{ cat }}" {% if product and product.category == cat %}selected{% endif %}>{{ cat }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label small fw-semibold">კვებითი ნიშანი</label>
                        <select name="dietary_tag" class="form-select rounded-3">
                            <option value="standard" {% if not product or product.dietary_tag != 'fasting' %}selected{% endif %}>კლასიკური</option>
                            <option value="fasting" {% if product and product.dietary_tag == 'fasting' %}selected{% endif %}>სამარხვო</option>
                        </select>
                    </div>

                    <div class="col-md-8">
                        <label class="form-label small fw-semibold">ალერგენები (არასავალდებულო)</label>
                        <input type="text" name="allergens" class="form-control rounded-3" placeholder="მაგ: გლუტენი (ხორბლის ფქვილი), რძის პროდუქტი" value="{{ product.allergens or '' if product else '' }}">
                    </div>

                    <div class="col-md-4">
                        <label class="form-label small fw-semibold">ერთეული *</label>
                        <input type="text" name="unit" class="form-control rounded-3" placeholder="1 კგ / 10 ცალი" value="{{ product.unit if product else '1 კგ' }}" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label small fw-semibold">წონა / მოცულობა</label>
                        <input type="text" name="weight_info" class="form-control rounded-3" placeholder="დაახლ. 20 ცალი" value="{{ product.weight_info or '' if product else '' }}">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label small fw-semibold">მარაგის რაოდენობა *</label>
                        <input type="number" name="stock_qty" min="0" max="500" class="form-control rounded-3" value="{{ product.stock_qty if product else 10 }}" required>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label small fw-semibold">საცალო ფასი (₾) *</label>
                        <input type="number" step="0.01" name="price" class="form-control rounded-3" value="{{ product.price if product else '' }}" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label small fw-semibold">საბითუმო ფასი (₾)</label>
                        <input type="number" step="0.01" name="wholesale_price" class="form-control rounded-3" value="{{ product.wholesale_price or '' if product else '' }}">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label small fw-semibold">მომზადების დრო</label>
                        <input type="text" name="cooking_time" class="form-control rounded-3" value="{{ product.cooking_time if product else '7-8 წუთი' }}">
                    </div>

                    <div class="col-12">
                        <label class="form-label small fw-semibold">შემადგენლობა</label>
                        <input type="text" name="ingredients" class="form-control rounded-3" value="{{ product.ingredients or '' if product else '' }}">
                    </div>

                    <div class="col-12">
                        <label class="form-label small fw-semibold">აღწერა</label>
                        <textarea name="description" rows="3" class="form-control rounded-3">{{ product.description or '' if product else '' }}</textarea>
                    </div>

                    <div class="col-12">
                        <label class="form-label small fw-semibold">ფოტო</label>
                        <input type="file" name="image" class="form-control rounded-3" accept="image/*">
                    </div>

                    <div class="col-12 mt-3">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="is_featured" id="isFeatured" {% if product and product.is_featured %}checked{% endif %}>
                            <label class="form-check-label small" for="isFeatured">რჩეული პროდუქტი</label>
                        </div>
                    </div>

                    <div class="col-12 mt-4 d-flex gap-2">
                        <button type="submit" class="btn btn-brand px-4">შენახვა</button>
                        <a href="{{ url_for('main.admin_panel') }}" class="btn btn-outline-secondary px-4">გაუქმება</a>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>

{% endblock %}
