{% extends "base.html" %}
{% block content %}
<div class="card border-0 shadow-sm rounded-4 p-4 mx-auto" style="max-width: 460px;">
    <h3 class="fw-bold text-center mb-4">რეგისტრაცია</h3>
    <form method="POST">
        <div class="mb-3">
            <label class="form-label">სახელი</label>
            <input type="text" name="username" class="form-control rounded-3" required>
        </div>
        <div class="mb-3">
            <label class="form-label">ელ-ფოსტა</label>
            <input type="email" name="email" class="form-control rounded-3" required>
        </div>
        <div class="mb-3">
            <label class="form-label">ტელეფონი</label>
            <input type="text" name="phone" class="form-control rounded-3" placeholder="5XX XX XX XX">
        </div>
        <div class="mb-3">
            <label class="form-label">პაროლი</label>
            <input type="password" name="password" class="form-control rounded-3" required>
        </div>
        <div class="mb-3">
            <label class="form-label">გაიმეორეთ პაროლი</label>
            <input type="password" name="confirm_password" class="form-control rounded-3" required>
        </div>
        <button type="submit" class="btn btn-terracotta w-100 py-2">რეგისტრაცია</button>
    </form>
</div>
{% endblock %}
