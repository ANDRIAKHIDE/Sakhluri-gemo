{% extends 'base.html' %}

{% block title %}სისტემაში შესვლა — სახლური გემო{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 45px auto 60px;">
    <div class="card-box" style="padding: 32px 28px;">
        <div style="text-align: center; margin-bottom: 24px;">
            <span style="display: inline-block; background: var(--primary-soft); color: var(--primary); font-size: 0.78rem; font-weight: 700; padding: 4px 12px; border-radius: 20px; margin-bottom: 8px;">
                პირადი კაბინეტი
            </span>
            <h1 style="font-size: 1.55rem; font-weight: 800; margin-bottom: 6px;">სისტემაში შესვლა</h1>
            <p style="font-size: 0.88rem; color: var(--text-muted);">შედით ანგარიშზე ბონუს-ბალანსისა და შეკვეთების სანახავად</p>
        </div>

        <form method="POST" action="{{ url_for('main.login') }}">
            <div style="margin-bottom: 16px;">
                <label style="display: block; font-size: 0.86rem; font-weight: 700; margin-bottom: 6px;">ელ-ფოსტა</label>
                <input type="email" name="email" required class="form-control" placeholder="name@example.com" style="padding: 11px 14px;">
            </div>

            <div style="margin-bottom: 22px;">
                <label style="display: block; font-size: 0.86rem; font-weight: 700; margin-bottom: 6px;">პაროლი</label>
                <input type="password" name="password" required class="form-control" placeholder="••••••••" style="padding: 11px 14px;">
            </div>

            <button type="submit" class="btn btn-primary btn-block" style="padding: 13px; font-size: 0.98rem;">
                შესვლა
            </button>
        </form>

        <div style="margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--border-color); text-align: center; font-size: 0.9rem; color: var(--text-muted);">
            არ გაქვთ ანგარიში?
            <a href="{{ url_for('main.register') }}" style="color: var(--primary); font-weight: 700; text-decoration: underline;">დარეგისტრირდით</a>
        </div>
    </div>
</div>
{% endblock %}
